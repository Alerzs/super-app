{% extends "base.html" %}
{% block title %}تغییر رمز | {{ site_name }}{% endblock %}
{% block content %}
<section class="px-5 py-4">
  <h1 class="text-2xl font-extrabold">تغییر رمز عبور</h1>
  <p class="mt-2 text-sm leading-7 text-[#686e7a]">رمز فعلی را وارد کنید و یک رمز تازه انتخاب کنید.</p>
  <form class="mt-6 space-y-4" method="post">
    {% csrf_token %}
    {% include "includes/form_fields.html" %}
    <button class="btn-primary w-full" type="submit">ذخیره رمز تازه</button>
  </form>
</section>
{% endblock %}
