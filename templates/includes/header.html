<header class="flex items-center justify-between px-5 pb-2 pt-4">
  <a href="{% url 'home' %}" class="text-xl font-extrabold tracking-tight">{{ site_name }}</a>
  {% if user.is_authenticated %}
    <a href="{% url 'profile' %}" class="grid h-9 w-9 place-items-center rounded-full bg-[#f2f4f6] text-sm font-bold" aria-label="حساب کاربری">
      {% if user.first_name %}{{ user.first_name|slice:":1" }}{% else %}ک{% endif %}
    </a>
  {% else %}
    <a href="{% url 'login' %}" class="text-sm font-bold text-[#1a73e8]">ورود</a>
  {% endif %}
</header>
