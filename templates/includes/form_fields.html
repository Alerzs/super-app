{% if form.non_field_errors %}
  <div class="rounded-xl bg-red-50 px-4 py-3 text-sm text-red-800">
    {% for error in form.non_field_errors %}
      <p>{{ error }}</p>
    {% endfor %}
  </div>
{% endif %}
{% for field in form %}
  <div>
    <label class="mb-1.5 block text-xs font-medium text-[#686e7a]" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}
      <div class="mt-1.5 text-xs leading-6 text-[#8b909a]">{{ field.help_text }}</div>
    {% endif %}
    {% for error in field.errors %}
      <p class="mt-1.5 text-sm text-red-700">{{ error }}</p>
    {% endfor %}
  </div>
{% endfor %}
